name: localkafka

# Apple-Silicon-friendly Confluent Platform 7.6.x stack.
# All images below publish multi-arch (linux/amd64 + linux/arm64) manifests,
# so no QEMU emulation is needed on darwin-aarch64.
#
# Bring the stack up from repo root:
#   docker compose -f scripts/docker-compose.yml up -d
# Tear down:
#   docker compose -f scripts/docker-compose.yml down -v

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    healthcheck:
      # `nc -z` requires netcat; cp-zookeeper ships it. `ruok` is the
      # canonical ZooKeeper liveness command.
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 12

  broker:
    image: confluentinc/cp-kafka:7.6.1
    hostname: broker
    container_name: broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      # Declare both listener names explicitly — `PLAINTEXT` for inter-
      # container traffic on 29092, `PLAINTEXT_HOST` for host-side clients
      # on 9092. Without KAFKA_LISTENERS the broker would only auto-bind
      # one, and clients hitting localhost:9092 would see "host unreachable".
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "broker:29092"
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  connect:
    image: confluentinc/cp-kafka-connect:7.6.1
    hostname: connect
    container_name: connect
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      localstack:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "broker:29092"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.json.JsonSchemaConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Confluent Hub installs plugins under /usr/share/confluent-hub-components
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ENDPOINT_URL: http://localstack:4566
    # Install the S3 sink connector on first boot, then hand off to the
    # image's default entrypoint. `confluent-hub install --no-prompt` is
    # idempotent, so restarts are cheap once the component is cached in the
    # image layer.
    command:
      - bash
      - -c
      - |
        set -e
        if [ ! -d /usr/share/confluent-hub-components/confluentinc-kafka-connect-s3 ]; then
          echo "Installing kafka-connect-s3..."
          confluent-hub install --no-prompt confluentinc/kafka-connect-s3:latest
        fi
        exec /etc/confluent/docker/run
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Plugin install on first run can take a minute or two.
      start_period: 90s

  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack:3
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      DEBUG: 1
      SERVICES: s3,sqs
    volumes:
      # `ready.d` hook: runs once the Localstack edge API is up.
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  connect-init:
    image: curlimages/curl:8.9.1
    depends_on:
      connect:
        condition: service_healthy
    command: ["sh", "-c", "/create_connector.sh"]
    environment:
      # Full URL (including scheme) so the init script doesn't rely on
      # curl's implicit http:// fallback.
      KAFKA_CONNECT_URL: http://connect:8083
    volumes:
      - type: bind
        source: ./create_connector.sh
        target: /create_connector.sh
    restart: "no"

  registry-init:
    image: curlimages/curl:8.9.1
    depends_on:
      schema-registry:
        condition: service_healthy
    command: ["sh", "-c", "/create.sh"]
    environment:
      SUBJECT: test-topic-value
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - type: bind
        source: ./create_schema.sh
        target: /create.sh
    restart: "no"
