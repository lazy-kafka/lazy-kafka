name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment strategy.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write  # Needed for PyPI publishing with OIDC

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --with pytest-cov pytest -q --cov=src/lazy_kafka --cov-report=term-missing

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cocogitto
        run: cargo install --locked cocogitto

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and changelog
        run: |
          if [ "${{ github.event.inputs.increment }}" = "auto" ]; then
            cog bump --auto --changelog
          else
            cog bump --increment "${{ github.event.inputs.increment }}" --changelog
          fi

      - name: Collect release metadata
        id: release_meta
        run: |
          tag="$(git describe --tags --abbrev=0)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${tag#v}" >> "$GITHUB_OUTPUT"
          cog changelog --at "${tag}" > release-notes.md

      - name: Verify package version matches tag
        run: |
          package_version=$(uv run python -c "import lazy_kafka; print(lazy_kafka.__version__)")
          echo "Tag version: ${{ steps.release_meta.outputs.clean_version }}"
          echo "Package version: $package_version"
          if [ "${{ steps.release_meta.outputs.clean_version }}" != "$package_version" ]; then
            echo "❌ Version mismatch!"
            echo "   Tag: ${{ steps.release_meta.outputs.tag }}"
            echo "   Package: $package_version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Push release commit and tag
        run: git push --follow-tags

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ steps.release_meta.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@de2c0eb89ae2a59587782423527426771e844896 # v2.0.1
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Release ${{ steps.release_meta.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-rc') || contains(steps.release_meta.outputs.tag, '-alpha') || contains(steps.release_meta.outputs.tag, '-beta') }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: "!contains(steps.release_meta.outputs.tag, '-rc') && !contains(steps.release_meta.outputs.tag, '-alpha') && !contains(steps.release_meta.outputs.tag, '-beta')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          # Use OIDC for authentication if PYPI_API_TOKEN is not set
          # Falls back to PYPI_API_TOKEN secret

      - name: Publish to TestPyPI (for pre-releases)
        if: "contains(steps.release_meta.outputs.tag, '-rc') || contains(steps.release_meta.outputs.tag, '-alpha') || contains(steps.release_meta.outputs.tag, '-beta')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          repository-url: https://test.pypi.org/legacy/
          # Use TEST_PYPI_API_TOKEN secret

      - name: Create GitHub Discussion for Release
        if: "!contains(steps.release_meta.outputs.tag, '-rc') && !contains(steps.release_meta.outputs.tag, '-alpha') && !contains(steps.release_meta.outputs.tag, '-beta')"
        uses: peter-evans/create-or-update-comment@719248295050f44478a8713c034335a594f5415c # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          issue-number: 1  # Use a dedicated discussion category
          body: |
            ## 🎉 Release ${{ steps.release_meta.outputs.tag }} is now available!

            ### Download

            ```bash
            pip install --upgrade lazy-kafka==${{ steps.release_meta.outputs.clean_version }}
            ```

            ### Highlights

            See the [release notes](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release_meta.outputs.tag }}) for details.

            ---

            **Please report any issues [here](${{ github.server_url }}/${{ github.repository }}/issues/new/choose).**
