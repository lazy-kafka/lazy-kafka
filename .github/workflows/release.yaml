name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment strategy.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write  # Needed for PyPI publishing with OIDC

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --with pytest-cov pytest -q --cov=src/lazy_kafka --cov-report=term-missing

      - name: Install cocogitto
        # Prebuilt static binary from the official release (musl, for glibc
        # runners); version + sha256 pinned. Avoids compiling cocogitto with
        # cargo, which took ~15 min on the runner.
        run: |
          url="https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz"
          checksum="e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb"
          curl -fsSL -o /tmp/cog.tgz "$url"
          echo "${checksum}  /tmp/cog.tgz" | shasum -a 256 -c -
          mkdir -p /tmp/cog-install
          tar -xz -C /tmp/cog-install -f /tmp/cog.tgz
          sudo install -m 0755 /tmp/cog-install/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
          cog --version

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and changelog
        # cocogitto 7.x: bump levels are --auto|--major|--minor|--patch (no
        # --increment flag). CHANGELOG.md is written automatically by bump
        # unless disabled in cog.toml, so there is no --changelog flag.
        run: |
          if [ "${{ github.event.inputs.increment }}" = "auto" ]; then
            cog bump --auto
          else
            cog bump --"${{ github.event.inputs.increment }}"
          fi

      - name: Collect release metadata
        id: release_meta
        run: |
          tag="$(git describe --tags --abbrev=0)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${tag#v}" >> "$GITHUB_OUTPUT"
          cog changelog --at "${tag}" > release-notes.md

      - name: Build sdist and wheel
        run: uv build

      - name: Verify package version matches tag
        run: |
          # Check the built artifact (not the pre-bump editable install)
          wheel=$(ls dist/*.whl)
          package_version=$(basename "$wheel" | cut -d- -f2)
          echo "Tag version: ${{ steps.release_meta.outputs.clean_version }}"
          echo "Package version: $package_version"
          if [ "${{ steps.release_meta.outputs.clean_version }}" != "$package_version" ]; then
            echo "❌ Version mismatch!"
            echo "   Tag: ${{ steps.release_meta.outputs.tag }}"
            echo "   Package: $package_version"
            exit 1
          fi

      - name: Push release commit and tag
        run: git push --follow-tags

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ steps.release_meta.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Release ${{ steps.release_meta.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-rc') || contains(steps.release_meta.outputs.tag, '-alpha') || contains(steps.release_meta.outputs.tag, '-beta') }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: "!contains(steps.release_meta.outputs.tag, '-rc') && !contains(steps.release_meta.outputs.tag, '-alpha') && !contains(steps.release_meta.outputs.tag, '-beta')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          # Use OIDC for authentication if PYPI_API_TOKEN is not set
          # Falls back to PYPI_API_TOKEN secret

      - name: Publish to TestPyPI (for pre-releases)
        if: "contains(steps.release_meta.outputs.tag, '-rc') || contains(steps.release_meta.outputs.tag, '-alpha') || contains(steps.release_meta.outputs.tag, '-beta')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          repository-url: https://test.pypi.org/legacy/
          # Use TEST_PYPI_API_TOKEN secret
